name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/premium-ui-finance-upgrade
      - feature/phase3-data-safety

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Run unit tests with Firebase emulators
        run: firebase emulators:exec --project demo-no-project --only auth,firestore --config firebase.json "gradle --no-daemon :app:testDebugUnitTest"

      - name: Generate CI-only debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-snapshots
          path: app/schemas/**
          if-no-files-found: warn
          retention-days: 7
