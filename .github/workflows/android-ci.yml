name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/premium-ui-finance-upgrade
      - feature/phase3-data-safety

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: latest
          java-package: jdk

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      # Android 17's API 37 SDK is published on the preview/canary channel.
      # The setup action installs stable-channel packages by default.
      - name: Install Android 17 API 37 SDK
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37|build-tools;37'
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "9.8.2"

      - name: Ensure selected JDK is first on PATH
        run: |
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version

      - name: Set up Node.js for Firebase rules tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.1

      - name: Install Firestore rules test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit JavaScript test dependencies
        run: npm audit --audit-level=high

      - name: Run Firestore rules and Android unit tests
        run: firebase emulators:exec --project demo-no-project --only auth,firestore --config firebase.json "npm run test:firestore-rules && gradle --no-daemon :app:testDebugUnitTest"

      - name: Generate CI-only debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Room schema snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: room-schema-snapshots
          path: app/schemas/**
          if-no-files-found: warn
          retention-days: 7
