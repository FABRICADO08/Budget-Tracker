name: "Dependabot Auto-Enforce & Merge"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

jobs:
  auto-rebase-on-main-push:
    name: "Rebase Open Dependabot PRs"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Rebase open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh pr list --author "app/dependabot" --state open --json number --jq '.[].number' || echo "")
          for pr in $open_prs; do
            echo "Requesting rebase for Dependabot PR #$pr..."
            gh pr comment "$pr" --body "@dependabot rebase" || true
          done

  dependabot-automation:
    name: "Enforce Dependabot Update"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log update metadata
        run: |
          echo "Dependency names: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          echo "Is security update: ${{ steps.metadata.outputs.is-security-update }}"
          echo "Target ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}"

      - name: Auto-approve PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL" --body "Approved automatically by Dependabot Enforcement Automation after validation."

      - name: Auto-merge patch, minor, and security updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.is-security-update == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Enable auto-merge so GitHub automatically merges the PR once all status checks (CI, CodeQL) pass
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge flag might not be enabled in repo settings, continuing."
